[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rangeforge"
version = "0.1.0"
description = "Deterministic, profile-driven cyber range scenario generator"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "networkx>=3.2,<4",
  "pydantic>=2.6,<3",
  "PyYAML>=6.0,<7",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.8,<2",
  "pytest>=8,<9",
  "ruff>=0.6,<1",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
rangeforge = "rangeforge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["rangeforge"]

[[tool.mypy.overrides]]
module = ["networkx", "networkx.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.hatch.build]
include = [
  "rangeforge/**/*.py",
  "rangeforge/**/*.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["rangeforge"]
